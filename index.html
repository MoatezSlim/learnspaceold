<style>/* LearnSpace — approved light identity (navy sidebar, blue accents, white rounded cards).
   Layout: fixed navy sidebar + fluid workspace; on phones a navy header sheet and bottom tabs. */
:root {
  color-scheme: light;
  --navy: #14243B;
  --navy-2: #1C3150;
  --navy-3: #243C60;
  --blue: #3978E5;           /* brand fills: progress, rings, active nav */
  --blue-strong: #2C67D4;    /* interactive text and buttons (AA on white) */
  --blue-press: #2357B8;
  --blue-50: #EDF3FD;
  --blue-100: #DCE8FB;
  --bg: #F4F6FA;

  --ink-2: #3A4A63;

  --line: #E4E9F2;
  --line-2: #D5DDEA;
  --green: #218568;
  --green-50: #E7F4EF;
  --red: #C94F53;
  --red-ink: #B4434A;
  --red-50: #FBEEEF;
  --amber: #E08A2E;
  --amber-ink: #A35D12;
  --amber-50: #FDF2E6;
  --violet: #6F63D9;
  --violet-50: #EFEDFC;
  --ring-track: #E3EAF6;
  --stage: radial-gradient(120% 95% at 50% 20%, #F4F8FE 0%, #E3ECF9 62%, #D7E4F6 100%);
  --stage-flat: #0D1922;
  --shadow-1: 0 1px 2px rgba(20, 36, 59, .05), 0 6px 20px rgba(20, 36, 59, .06);
  --shadow-2: 0 2px 6px rgba(20, 36, 59, .08), 0 18px 40px rgba(20, 36, 59, .12);
  --r-card: 16px;
  --r-ctl: 10px;
  --font: 'Nunito Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --serif: 'Source Serif 4', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --side-w: calc(160 * var(--u));
  /* one design unit = one pixel of the 861 px reference dashboard */
  --u: clamp(1.16px, calc(100vw / 861), 2.05px);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.row-gap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: grid; gap: 20px; }

.eyebrow.light { color: rgba(255,255,255,.72); letter-spacing: .02em; text-transform: none; font-weight: 600; font-size: 13px; }
.card-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--navy); color: #fff; padding: 10px 14px; border-radius: 8px; }
.skip:focus { top: 12px; }

/* ---------------------------------------------------------------- boot frame */
.boot { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; }
.boot-side { background: var(--navy); }
.boot-main { padding: 40px; display: grid; gap: 16px; align-content: start; }
.boot-line, .boot-card, .boot-tile { background: linear-gradient(90deg, #E8EDF5, #F2F5FA, #E8EDF5); background-size: 200% 100%; border-radius: 12px; animation: shimmer 1.4s linear infinite; }

@media (max-width: 999px) { .boot { grid-template-columns: 1fr; } .boot-side { height: 160px; } .boot-row { grid-template-columns: 1fr 1fr; } .boot-main { padding: 20px 16px; } }

/* ---------------------------------------------------------------- shell */
.app { min-height: 100vh; background: radial-gradient(1200px 520px at 78% -10%, #EAF2FE 0%, rgba(234,242,254,0) 60%), var(--bg); }
.app { --sb-w: calc(150 * var(--u)); --sb-p: 1; --sb-ease: cubic-bezier(.22, .8, .24, 1); }
.app.sb-rail { --sb-w: calc(52 * var(--u)); --sb-p: 0; }
.app.is-desktop { display: grid; grid-template-columns: calc(var(--sb-w) + 10 * var(--u)) minmax(0, 1fr); transition: grid-template-columns .36s var(--sb-ease); }
.main { min-width: 0; display: flex; flex-direction: column; }

.page { padding: 8px calc(20 * var(--u)) 48px calc(21 * var(--u)); max-width: calc(850 * var(--u) - var(--sb-w)); width: 100%; margin: 0; display: grid; gap: 22px; align-content: start; transition: max-width .36s var(--sb-ease); }
.page-head { display: grid; gap: 4px; padding-top: 8px; }
.page-head.row-between { display: flex; }

/* floating sidebar */
.sidebar { position: sticky; top: calc(10 * var(--u)); margin: calc(10 * var(--u)) 0 calc(10 * var(--u)) calc(10 * var(--u)); height: calc(100vh - 20 * var(--u)); width: var(--sb-w); transition: width .36s var(--sb-ease);
  background: linear-gradient(180deg, #0C2643 0%, #0A223C 55%, #08203A 100%); color: #fff; display: flex; flex-direction: column;
  padding: calc(16 * var(--u)) calc(8 * var(--u)) calc(12 * var(--u)); gap: calc(14 * var(--u)); border-radius: calc(16 * var(--u));
  box-shadow: 0 calc(18 * var(--u)) calc(38 * var(--u)) rgba(8, 28, 52, .30), 0 calc(4 * var(--u)) calc(10 * var(--u)) rgba(8, 28, 52, .18), inset 0 1px 0 rgba(255,255,255,.06); z-index: 20; }
.sidebar-logo { background: none; border: 0; padding: 0 calc(6 * var(--u)); text-align: left; color: #fff; border-radius: 10px; }
.logo { display: inline-flex; align-items: center; gap: calc(9 * var(--u)); font-weight: 700; font-size: calc(13 * var(--u)); letter-spacing: -0.005em; color: var(--navy); }
.logo-light { color: #fff; }
.logo-mark { width: calc(20 * var(--u)); height: calc(20 * var(--u)); flex: none; }
.sidebar ul { list-style: none; margin: calc(6 * var(--u)) 0 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: calc(2.5 * var(--u)); }
.sidebar li { min-width: 0; }
.nav-item { position: relative; width: 100%; display: flex; align-items: center; gap: calc(12 * var(--u)); height: calc(27 * var(--u)); padding: 0 calc(10 * var(--u)); border-radius: calc(7 * var(--u)); border: 0; background: transparent;
  color: #D5DFEE; font-weight: 600; font-size: calc(9.1 * var(--u)); text-align: left; transition: background .15s, color .15s; }
.nav-item svg { width: calc(14 * var(--u)); height: calc(14 * var(--u)); flex: none; }
.nav-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-item.active { background: linear-gradient(90deg, #11447F, #134A88); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 calc(3 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, .18); }
.sidebar-user { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: calc(6 * var(--u)); border-radius: calc(10 * var(--u)); border: 0; background: transparent; color: #fff; }
.sidebar-user:hover { background: rgba(255,255,255,.07); }
.sidebar-user > svg { width: calc(10 * var(--u)); height: calc(10 * var(--u)); color: #C9D5E6; flex: none; opacity: var(--sb-fade); transition: opacity .18s; }
.user-chip { display: inline-flex; align-items: center; gap: calc(8 * var(--u)); min-width: 0; }
.user-photo, .lea-photo { display: block; max-width: none; border-radius: 50%; object-fit: cover; flex: none; }
.user-chip .user-photo { width: calc(25 * var(--u)); height: calc(25 * var(--u)); box-shadow: 0 0 0 calc(1.2 * var(--u)) rgba(255,255,255,.35); }
.user-chip.compact .user-photo { width: calc(25 * var(--u)); height: calc(25 * var(--u)); box-shadow: 0 0 0 calc(1.4 * var(--u)) #fff, 0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(20,36,59,.18); }
.user-meta { display: grid; text-align: left; min-width: 0; line-height: 1.25; }
.user-meta strong { font-size: calc(8.2 * var(--u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* sliding sidebar: full width or icons only (drag the edge or the round handle, or click it) */
.sidebar { --sb-fade: clamp(0, calc(var(--sb-p) * 2.2 - 1.2), 1); }
.sb-label { min-width: 0; overflow: hidden; white-space: nowrap; opacity: var(--sb-fade); transition: opacity .18s ease; }
.sidebar .logo-text { opacity: var(--sb-fade); transition: opacity .18s ease; white-space: nowrap; }

.sidebar-logo { display: flex; overflow: hidden; }

  background: linear-gradient(135deg, #2F7BF0 0%, #1E5FD6 100%); color: #fff; font-weight: 700; font-size: calc(9.1 * var(--u)); text-align: left;
  box-shadow: 0 calc(4 * var(--u)) calc(12 * var(--u)) rgba(17, 82, 199, .42), inset 0 1px 0 rgba(255,255,255,.2); transition: filter .15s, box-shadow .15s; }
.sb-new:hover { filter: brightness(1.08); box-shadow: 0 calc(6 * var(--u)) calc(16 * var(--u)) rgba(17, 82, 199, .5), inset 0 1px 0 rgba(255,255,255,.2); }
.sb-new-icon { width: calc(20 * var(--u)); height: calc(20 * var(--u)); display: grid; place-items: center; border-radius: calc(6 * var(--u)); background: rgba(255,255,255,.2); flex: none; }

.sb-plan-icon { position: relative; width: calc(20 * var(--u)); height: calc(20 * var(--u)); display: grid; place-items: center; border-radius: calc(6 * var(--u)); background: linear-gradient(135deg, #F8CD69, #E59A2F); color: #4A2A00; flex: none; }

.is-expired .sb-plan-text small { color: #FF9C99; }
.sb-plan-more { display: grid; gap: calc(7 * var(--u)); padding: 0 calc(7 * var(--u)) calc(var(--sb-fade) * 7 * var(--u)); max-height: calc(var(--sb-fade) * 60 * var(--u)); overflow: hidden; opacity: var(--sb-fade); transition: opacity .18s ease .1s, max-height .32s var(--sb-ease), padding .32s var(--sb-ease); }
.sb-rail .sb-plan-more { visibility: hidden; transition: opacity .12s ease, max-height .32s var(--sb-ease), padding .32s var(--sb-ease), visibility 0s .32s; }
.sb-plan-bar { display: block; height: calc(3 * var(--u)); border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }

.sb-plan-pay:hover { background: #EAF2FF; }

.app.sb-dragging .sb-label, .app.sb-dragging .logo-text, .app.sb-dragging .sb-toggle svg, .app.sb-dragging .sb-plan-more, .app.sb-dragging .sidebar-user > svg { transition: none; }

.reduce-motion .sb-label, .reduce-motion .sidebar .logo-text, .reduce-motion .sb-toggle svg, .reduce-motion .sb-plan-more { transition: none; }

  background: #0B1F36; color: #fff; font-size: 12.5px; font-weight: 650; line-height: 1.3; box-shadow: 0 8px 24px rgba(8,28,52,.28); opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s; z-index: 30; }

@media (min-width: 1000px) and (min-aspect-ratio: 9/5), (min-width: 1765px) and (max-height: 980px) {

  .sidebar ul { gap: calc(1.5 * var(--u)); margin-top: calc(3 * var(--u)); }

}

.topbar .icon-btn svg { width: calc(14 * var(--u)); height: calc(14 * var(--u)); }
.icon-btn { position: relative; width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); transition: background .15s; flex: none; }

/* ---------------------------------------------------------------- Léa (frames of her character sheet + live SVG eyes) */
.lea { position: relative; overflow: hidden; width: 100%; }

.lea-head { transform-origin: 50% 80%; will-change: transform; }

@keyframes lea-in { from { opacity: 0; } }
.lea-base { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.lea-fx { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.lea-face { aspect-ratio: 1; border-radius: 50%; background: var(--stage-flat); }

.reduce-motion .lea-breathe, .reduce-motion .lea-layer { animation: none; }
/* reactions: sparkles when the learner does well, confetti for a finished lesson, a little rain when it goes wrong */
.lea-effects { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.lea-effects i { position: absolute; display: block; }
.fx-sparkle i { left: 50%; top: 34%; width: 12%; aspect-ratio: 1; margin: -6% 0 0 -6%; background: #FFC531; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
  --a: calc(var(--i) * 360deg / var(--n)); animation: fx-spark 1.1s cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i) * 35ms); }
.fx-sparkle i:nth-child(3n) { background: #5AA1FF; width: 9%; } .fx-sparkle i:nth-child(3n+1) { width: 7%; }
@keyframes fx-spark { 0% { transform: rotate(var(--a)) translateY(0) scale(.2); opacity: 0; } 30% { opacity: 1; } 100% { transform: rotate(var(--a)) translateY(-210%) scale(1); opacity: 0; } }
.fx-confetti i { top: -6%; left: calc(4% + var(--i) * 92% / var(--n)); width: 4.5%; height: 2.4%; border-radius: 1px; background: #3978E5;
  animation: fx-fall 1.9s cubic-bezier(.3,.6,.5,1) both; animation-delay: calc(var(--i) * 45ms); }
.fx-confetti i:nth-child(4n) { background: #FFC531; } .fx-confetti i:nth-child(4n+1) { background: #2BB27E; } .fx-confetti i:nth-child(4n+2) { background: #F06B7E; }
@keyframes fx-fall { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(520%) translateX(calc((var(--i) - 8) * 6%)) rotate(540deg); opacity: 0; } }
.fx-rain i { top: 4%; left: calc(22% + var(--i) * 56% / var(--n)); width: 1.6%; height: 7%; border-radius: 99px; background: linear-gradient(180deg, rgba(120,160,220,0), rgba(120,160,220,.75));
  animation: fx-rain 1s linear infinite; animation-delay: calc(var(--i) * 140ms); }
@keyframes fx-rain { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(260%); opacity: 0; } }
/* speech bubbles: text typed as if she were talking */

/* ---------------------------------------------------------------- Léa presents a course (pop-up) */

.guide-actions { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.guide-btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: linear-gradient(180deg, #2A86F6, #1670E8); color: #fff; font-weight: 700; font-size: 13.5px; box-shadow: 0 6px 14px rgba(22,112,232,.25); }

.guide-close:hover { background: var(--bg); color: var(--ink); }

.guide-sheet { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: end; background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 -6px 34px rgba(20,36,59,.22); overflow: hidden; animation: sheet-in .32s cubic-bezier(.2,.9,.3,1.1) both; }

.player-foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13px; }
.player-error { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--amber-ink); background: var(--amber-50); padding: 8px 10px; border-radius: 10px; }
.player-error svg { flex: none; margin-top: 2px; }
.transcript { margin: 0; padding: 4px 0 0; list-style: none; display: grid; gap: 6px; }
.transcript li { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 6px 8px; border-radius: 8px; font-family: var(--serif); font-size: 16px; }
.transcript li strong { font-family: var(--font); font-size: 13px; color: var(--muted); padding-top: 2px; }
.transcript li.current { background: var(--blue-50); }
.video { display: grid; gap: 8px; }
.video video { width: 100%; border-radius: 16px; background: #0E1C2A; aspect-ratio: 16 / 9; box-shadow: var(--shadow-1); }
.video-caption { min-height: 48px; padding: 10px 14px; border-radius: 12px; background: var(--navy); color: #fff; font-family: var(--serif); font-size: 17px; }
.video-caption .muted { color: rgba(255,255,255,.65); font-family: var(--font); font-size: 14px; }
.switch-inline { display: inline-flex; gap: 8px; align-items: center; }
.reading { background: #FFFDF8; border: 1px solid #EFE7D6; border-radius: 16px; padding: 22px 26px; font-family: var(--serif); font-size: 18px; line-height: 1.6; color: #2A2A2A; box-shadow: var(--shadow-1); display: grid; gap: 10px; max-width: 70ch; }
.reading h3 { font-family: var(--serif); font-size: 20px; font-weight: 600; }
.media-intro { padding: 16px 18px; display: grid; gap: 8px; }
.keypoints { margin: 0; padding-left: 20px; color: var(--ink-2); display: grid; gap: 4px; }
.question { display: grid; gap: 12px; }
.q-prompt { font-size: 16px; font-weight: 700; }
.q-num { color: var(--muted); }
.options { display: grid; gap: 10px; }
.option { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; text-align: left; font-weight: 550; transition: border-color .15s, background .15s; min-height: 50px; }
.option:hover:not(:disabled) { border-color: var(--blue-100); background: #FAFCFF; }
.opt-key { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-2); font-size: 13px; font-weight: 700; color: var(--muted); }
.option.is-selected { border-color: var(--blue); background: var(--blue-50); }
.option.is-selected .opt-key { border-color: var(--blue); background: var(--blue); color: #fff; }
.option.is-correct { border-color: var(--green); background: var(--green-50); color: #155C47; }
.option.is-correct .opt-key { border-color: var(--green); background: var(--green); color: #fff; }
.option.is-wrong { border-color: var(--red); background: var(--red-50); color: var(--red-ink); }
.option.is-wrong .opt-key { border-color: var(--red); background: var(--red); color: #fff; }
.option.is-muted { opacity: .62; }
.option:disabled { cursor: default; }
.short input { width: 100%; max-width: 440px; height: 48px; border-radius: 12px; border: 1.5px solid var(--line-2); padding: 0 14px; background: #fff; font-size: 16px; }
.short input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px rgba(57,120,229,.18); }
.short input.is-correct { border-color: var(--green); background: var(--green-50); }
.short input.is-wrong { border-color: var(--red); background: var(--red-50); }
.field-error { color: var(--red-ink); font-size: 13.5px; font-weight: 600; }
.feedback { border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; border: 1px solid; outline: none; animation: rise .25s ease both; }
.feedback.ok { background: var(--green-50); border-color: #BFE3D6; }
.feedback.ok .feedback-head { color: #1B6E56; }
.feedback.ko { background: var(--red-50); border-color: #F0CDD0; }
.feedback.ko .feedback-head { color: var(--red-ink); }
.feedback.reveal { background: var(--blue-50); border-color: var(--blue-100); }
.feedback.reveal .feedback-head { color: var(--blue-strong); }
.feedback-head { display: flex; align-items: center; gap: 8px; }
.feedback-label { font-weight: 700; }
.lesson-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 4px; }
.lesson-side { display: grid; gap: 16px; position: sticky; top: 16px; }
.lesson-assistant { overflow: hidden; }
.lesson-stage { position: relative; overflow: hidden; background: var(--stage); }
.lesson-stage .lea { width: 100%; }
.lesson-assistant-body { padding: 14px; display: grid; gap: 10px; }
.lesson-assistant-head { display: flex; justify-content: space-between; align-items: center; }
.lesson-bubble { font-size: 13.5px; }
.steps-card { padding: 16px; }
.steps-card h2 { font-size: 15px; margin-bottom: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.step button { width: 100%; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; padding: 9px 8px; border: 0; background: none; border-radius: 10px; text-align: left; color: var(--muted); font-weight: 600; font-size: 14px; }
.step button:not(:disabled):hover { background: var(--blue-50); }
.step-icon { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-2); font-size: 12px; font-weight: 700; color: var(--muted); }
.step.done .step-icon { border-color: var(--green); color: var(--green); }
.step.current .step-icon { border-color: var(--blue); background: var(--blue); color: #fff; }
.step.current button { background: var(--blue-50); color: var(--blue-strong); }
.step-status { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.step.done .step-status { color: var(--green); }
.done-card { display: flex; gap: 24px; align-items: center; padding: 24px; flex-wrap: wrap; }
.done-card > div { display: grid; gap: 8px; }
.result { display: grid; gap: 16px; }
.result-hero { display: flex; gap: 22px; align-items: center; padding: 22px; flex-wrap: wrap; }
.result-hero > div { display: grid; gap: 8px; justify-items: start; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.result-grid .card { padding: 18px; display: grid; gap: 10px; align-content: start; }
.answers { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.answers li { display: flex; gap: 10px; align-items: flex-start; }
.answers li.ok svg { color: var(--green); } .answers li.ko svg { color: var(--red); }
.answers svg, .badge-line svg { flex: none; margin-top: 3px; }
.badge-line { display: flex; gap: 8px; }

/* ---------------------------------------------------------------- library & courses */
.lib-search { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; color: var(--muted); box-shadow: var(--shadow-1); max-width: 760px; }
.lib-search:focus-within { border-color: var(--blue); }
.lib-search input { flex: 1; border: 0; outline: none; padding: 13px 0; background: transparent; color: var(--ink); min-width: 0; }
.lib-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg-btn { border: 1px solid transparent; background: #E9EEF6; color: var(--ink-2); padding: 8px 16px; border-radius: 99px; font-weight: 650; font-size: 13.5px; }
.seg-btn:hover { background: #DEE6F2; }
.seg-btn.active { background: var(--blue-strong); color: #fff; }
.filter-btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: #fff; padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 13.5px; }
.filter-btn.has { border-color: var(--blue); color: var(--blue-strong); }
.filters { width: 280px; padding: 14px; display: grid; gap: 8px; }
.filters label { font-size: 13px; font-weight: 650; color: var(--ink-2); }
.filters select, .field select, .field input, .select-wrap select { height: 40px; border-radius: 10px; border: 1px solid var(--line-2); padding: 0 10px; background: #fff; width: 100%; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 500 !important; }
.lib-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; align-items: start; }
.cats h2 { font-size: 15px; margin-bottom: 10px; }
.cats ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.cat { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: transparent; border-radius: 10px; text-align: left; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.cat:hover { background: rgba(20,36,59,.05); }
.cat.active { background: var(--blue-50); color: var(--blue-strong); }
.cat-icon { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); flex: none; }
.cat-count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.course-grid.wide { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.course-card { overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
.course-card:hover { box-shadow: var(--shadow-2); }
.course-card-hit { border: 0; padding: 0; background: none; display: block; width: 100%; }
.course-card .cover { aspect-ratio: 16 / 10; }
.course-card-body { padding: 12px 14px 14px; display: grid; gap: 6px; flex: 1; align-content: start; }
.course-card-body h3 { font-size: 16px; }
.course-desc { font-size: 13.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.course-progress { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.course-progress .bar { flex: 1; }
.course-progress.big { font-size: 14px; max-width: 520px; }
.course-card-actions { margin-top: 4px; }
.course-card .skeleton { margin: 8px 12px 0; }
.next-banner { display: flex; align-items: center; gap: 16px; padding: 16px 18px; flex-wrap: wrap; }
.next-banner > div { display: grid; gap: 2px; flex: 1; min-width: 200px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted); font-weight: 600; padding: 0; justify-self: start; }
.back-link:hover { color: var(--blue-strong); }
.course-hero { display: grid; grid-template-columns: 300px minmax(0, 1fr); overflow: hidden; }
.course-hero-cover { min-height: 230px; }
.course-hero-body { padding: 22px 24px; display: grid; gap: 10px; align-content: start; }
.course-hero-body p:first-of-type { color: var(--ink-2); max-width: 62ch; }
.modules { display: grid; gap: 12px; }
.module { overflow: hidden; }
.module-head { width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) 140px 20px; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: none; text-align: left; }
.module-num { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--blue-50); color: var(--blue-strong); font-weight: 750; }
.module-num.complete { background: var(--green-50); color: var(--green); }
.module-title { display: grid; }
.module-title small { color: var(--muted); font-size: 12.5px; }
.module-chev { transition: transform .2s; color: var(--muted); }
.module.open .module-chev { transform: rotate(180deg); }
.lessons { list-style: none; margin: 0; padding: 0 12px 12px; display: grid; gap: 2px; }
.lesson-item { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; }
.lesson-item.is-next { background: var(--blue-50); }
.li-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #F0F3F8; color: var(--ink-2); }
.lesson-item.is-done .li-icon { background: var(--green-50); color: var(--green); }
.lesson-item.is-next .li-icon { background: var(--blue-strong); color: #fff; }
.li-body { display: grid; min-width: 0; }
.li-body small { color: var(--muted); font-size: 12.5px; }
.li-soon { display: inline-flex; gap: 4px; align-items: center; }

/* ---------------------------------------------------------------- progress */
.select-wrap select { width: auto; min-width: 120px; font-weight: 600; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px; font-weight: 650; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; border-radius: 8px 8px 0 0; }
.tab.active { color: var(--blue-strong); border-bottom-color: var(--blue); background: var(--blue-50); }
.prog-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.prog-row { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: stretch; }
.prog-row.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.chart-card { padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; min-width: 0; }
.coach-card { overflow: hidden; display: flex; flex-direction: column; }
.coach-stage { position: relative; overflow: hidden; background: var(--stage); }
.coach-stage .lea { width: 100%; }
.coach-body { padding: 16px; display: grid; gap: 8px; }
.coach-body h2 { font-size: 16px; }
.prog-row > .card:not(.chart-card):not(.coach-card) { padding: 18px; display: grid; gap: 8px; align-content: start; }
.skill-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.skill-tile { padding: 16px; display: grid; justify-items: center; text-align: center; gap: 6px; }
.skill-tile strong { font-size: 14px; }
.skill-tile .bar { width: 100%; }
.skill-level { font-weight: 750; color: var(--ink); }
.chart { position: relative; width: 100%; min-width: 0; overflow: hidden; }
.chart svg { display: block; overflow: visible; outline: none; }
.chart svg:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; border-radius: 8px; }
.chart .grid { stroke: #E7ECF4; stroke-width: 1; }
.chart .tick { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--blue); opacity: .1; }
.chart .dot { fill: var(--blue); stroke: #fff; stroke-width: 2; }
.chart .crosshair { stroke: #AFC0D8; stroke-width: 1; }
.chart .end-pill { fill: var(--navy); }
.chart .end-label { fill: #fff; font-size: 11.5px; font-weight: 700; }
.chart .bar-mark { fill: #9DBDF3; transition: fill .15s; }
.chart .bar-mark.met { fill: var(--blue); }
.chart .bar-mark.hot { fill: var(--blue-press); }
.chart .goal { stroke: var(--green); stroke-width: 1.2; }
.chart .goal-label { font-size: 11.5px; fill: var(--green); font-weight: 650; }
.tooltip { position: absolute; z-index: 5; pointer-events: none; background: var(--navy); color: #fff; padding: 7px 10px; border-radius: 9px; display: grid; font-size: 12px; box-shadow: var(--shadow-2); min-width: 120px; }
.tooltip strong { font-size: 15px; }
.table-wrap { overflow-x: auto; max-height: 260px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data-table th, .data-table td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.assess { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 10px; }
.assess li { display: grid; grid-template-columns: minmax(0, 1fr) 110px 44px auto; gap: 10px; align-items: center; font-size: 13.5px; }
.assess-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.assess-bar { position: relative; height: 8px; border-radius: 99px; background: var(--ring-track); }
.assess-bar span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; }
.assess-bar span.ok { background: var(--green); } .assess-bar span.ko { background: var(--amber); }
.assess-bar i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); border-radius: 1px; }
.assess-val { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.course-progress-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.course-progress-list button { width: 100%; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) 110px; align-items: center; gap: 14px; padding: 9px 8px; border: 0; background: none; border-radius: 10px; text-align: left; }
.course-progress-list button:hover { background: var(--blue-50); }
.cpl-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cpl-val { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.progress > .stack > section.card { padding: 18px; }
.skill-rows, .comp-list, .history { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.skill-rows li { display: grid; grid-template-columns: 200px minmax(0, 1fr) 150px; gap: 14px; align-items: center; }
.sr-name { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; }
.sr-val { text-align: right; font-size: 13px; color: var(--muted); }
.comp-list { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.comp-list li { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; background: #F6F8FB; }
.comp-list li > span:last-child { display: grid; }
.comp-list small { color: var(--muted); font-size: 12.5px; }
.comp-icon { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #E8EDF5; color: var(--muted); }
.comp-list li.ok .comp-icon { background: var(--green-50); color: var(--green); }
.history li { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border-bottom: 1px solid var(--line); }
.history time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.history li > span { display: grid; min-width: 0; }
.history small { color: var(--muted); font-size: 12.5px; }

/* ---------------------------------------------------------------- badges */
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.badge-card { padding: 18px; display: grid; gap: 8px; justify-items: start; align-content: start; }
.badge-medal { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; }
.badge-card.earned .badge-medal { background: linear-gradient(140deg, #FFE7A8, #F6C35B); color: #7A4B00; box-shadow: 0 6px 16px rgba(246,195,91,.4); }
.badge-card.locked .badge-medal { background: #EEF1F6; color: #8A97AB; }
.badge-card.locked h2 { color: var(--ink-2); }
.badge-progress { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- chat */
.messages { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; padding-top: 12px; }
.chat { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-1); min-height: 0; overflow: hidden; }
.chat-page { height: min(760px, calc(100vh - 110px)); }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.chat-avatar { width: 56px; height: 56px; flex: none; }
.chat-avatar .lea { width: 100%; box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--blue-100); }
.chat-title { display: grid; gap: 2px; flex: 1; min-width: 0; }
.chat-title h2 { font-size: 17px; }
.menu-wrap { position: relative; }
.menu-wrap .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-2); padding: 6px; min-width: 240px; }
.chat-notice { display: flex; gap: 8px; align-items: center; margin: 10px 16px 0; padding: 8px 12px; border-radius: 10px; background: var(--amber-50); color: var(--amber-ink); font-size: 13px; font-weight: 600; }
.chat-list { list-style: none; margin: 0; padding: 18px 16px; display: grid; gap: 14px; overflow-y: auto; flex: 1; align-content: start; background: linear-gradient(180deg, #FAFBFE, #fff); }
.chat-empty { display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--muted); padding: 30px 10px; }
.msg { display: flex; gap: 10px; align-items: flex-start; max-width: 88%; }
.msg-user { margin-left: auto; flex-direction: row-reverse; }
.msg-avatar { width: 36px; height: 36px; flex: none; margin-top: 2px; }
.msg-avatar .lea, .launcher-avatar .lea, .chat-avatar .lea { border-radius: 50%; }
.msg-col { display: grid; gap: 6px; min-width: 0; }
.msg-bubble { padding: 11px 14px; border-radius: 16px; background: #fff; border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(20,36,59,.04); display: grid; gap: 6px; font-size: 14.5px; color: var(--ink-2); }
.msg-assistant .msg-bubble { border-bottom-left-radius: 6px; }
.msg-user .msg-bubble { background: var(--navy); color: #fff; border-color: var(--navy); border-bottom-right-radius: 6px; }
.msg-user time { justify-self: end; font-size: 11px; color: rgba(255,255,255,.65); }
.msg-error .msg-bubble { border-color: #F0CDD0; }
.msg-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-action { background: var(--blue-50); border-color: var(--blue-100); }

/* ---------------------------------------------------------------- settings */

/* ---------------------------------------------------------------- dialogs: large variant, new course, payment */

.sub-status-head { display: flex; align-items: center; gap: 14px; }
.sub-crown { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(135deg, #F8CD69, #E59A2F); color: #4A2A00; flex: none; box-shadow: 0 6px 16px rgba(229,154,47,.35); }
.sub-status-name { flex: 1; min-width: 0; }
.sub-status h2 { color: #fff; font-size: 21px; }
.sub-until { color: #D5E0EF; font-size: 15px; }
.sub-until strong { color: #fff; }
.sub-period { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; font-size: 13px; color: #C9D8EE; font-weight: 600; }
.sub-status.is-due .bar-light > span { background: linear-gradient(90deg, #F7B35B, #FF8A3D); }
.sub-status.is-expired .bar-light > span { background: #F25F5C; }
.sub-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 4px; }
.sub-hint { font-size: 13.5px; color: #FFC37A; font-weight: 600; }
.sub-status.is-expired .sub-hint { color: #FF9C99; }
.sub-benefits { padding: 20px; display: grid; gap: 14px; align-content: start; }
.sub-benefits ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.sub-benefits li { display: flex; align-items: flex-start; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.sub-benefits li svg { flex: none; margin-top: 1px; padding: 2px; border-radius: 50%; background: var(--green-50); color: var(--green); width: 20px; height: 20px; }
.sub-plans-card { padding: 20px; display: grid; gap: 14px; }
.sub-plans-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.sub-plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.sub-plan { display: grid; gap: 6px; align-content: start; justify-items: start; padding: 16px 18px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; }
.sub-plan.is-current { border-color: var(--blue); background: linear-gradient(180deg, #F3F7FF, #fff 70%); }
.sub-plan-top { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sub-plan-top strong { font-size: 16px; }
.sub-price { color: var(--muted); }
.sub-price strong { font-size: 25px; letter-spacing: -0.015em; color: var(--ink); }
.sub-plan .btn { margin-top: 8px; }
.sub-bottom { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.4fr); gap: 16px; align-items: start; }
.sub-method, .sub-invoices { padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; min-width: 0; }
.sub-cardvis { position: relative; width: 100%; max-width: 300px; aspect-ratio: 1.586; display: grid; align-content: space-between; padding: 16px 18px; border-radius: 14px; color: #fff; overflow: hidden;
  background: radial-gradient(160px 120px at 90% 0%, rgba(127,176,255,.45), transparent 70%), linear-gradient(135deg, #1D63D8, #0C2A4C); box-shadow: 0 12px 26px rgba(12,42,76,.3); }
.sub-chip { width: 34px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #F7D58B, #D8A748); }
.sub-num { font-size: 17px; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.sub-cardname { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; opacity: .9; }
.sub-cardname em { font-style: normal; }
.sub-method-line { display: flex; align-items: center; gap: 8px; font-weight: 650; }
.sub-method-line svg { color: var(--blue-strong); }
.table-wrap { position: relative; overflow-x: auto; margin: 0 -4px; padding: 0 4px; } /* positioned: the visually hidden header cell stays inside */
.sub-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.sub-table th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 650; white-space: nowrap; }
.sub-table td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sub-table tr:last-child td { border-bottom: 0; }
.sub-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.sub-table .link-inline { gap: 5px; }
@media (max-width: 1240px) { .sub-bottom { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 999px) {
  .sub-top, .sub-plans { grid-template-columns: minmax(0, 1fr); }
  .sub-status { padding: 18px; }
  .dialog-backdrop { align-items: end; padding: 10px; }
  .dialog-lg { max-height: 92vh; padding: 18px 16px 14px; }
  .dialog-lg .dialog-body { margin: 0 -16px; padding: 0 16px 4px; }
  .nc-item { grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding: 10px; }
  .nc-cover { width: 76px; height: 56px; }
  .nc-item .btn { grid-column: 1 / -1; justify-self: stretch; }
  .pay-plans { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  /* invoices: one compact block per payment instead of a wide table */
  .sub-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .sub-table, .sub-table tbody { display: block; }
  .sub-table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'date amount' 'period status' 'plan link'; column-gap: 12px; row-gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sub-table tr:last-child { border-bottom: 0; }
  .sub-table td { padding: 0; border: 0; white-space: normal; }
  .sub-table td:nth-child(1) { grid-area: date; font-weight: 700; }
  .sub-table td:nth-child(2) { grid-area: period; color: var(--muted); font-size: 13px; }
  .sub-table td:nth-child(3) { grid-area: plan; color: var(--muted); font-size: 13px; }
  .sub-table td:nth-child(4) { grid-area: amount; font-weight: 700; }
  .sub-table td:nth-child(5) { grid-area: status; justify-self: end; }
  .sub-table td:nth-child(6) { grid-area: link; justify-self: end; }
  .pay-summary dd svg { display: none; }
}

/* ---------------------------------------------------------------- profile picture */
.user-photo { overflow: hidden; }
.photo-dlg { width: min(540px, 100%); }
.photo-body { display: grid; gap: 18px; }
.photo-top { display: flex; align-items: center; gap: 18px; }
.photo-preview { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; flex: none; overflow: hidden; box-shadow: 0 0 0 4px #fff, 0 0 0 5px var(--line), 0 10px 24px rgba(20,36,59,.14); }
.photo-actions { display: grid; gap: 8px; justify-items: start; min-width: 0; }
.photo-actions strong { font-size: 16px; }
.photo-actions small { font-size: 12.5px; line-height: 1.4; }
.photo-grid { margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 12px; }
.photo-grid legend { padding: 0 0 10px; font-weight: 700; font-size: 14px; color: var(--ink); }
.photo-tile { position: relative; aspect-ratio: 1; border-radius: 50%; cursor: pointer; transition: transform .12s, box-shadow .12s; }
.photo-tile input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.photo-tile svg, .photo-tile img { width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover; overflow: hidden; }
.photo-tile:hover { transform: scale(1.06); }
.photo-tile.is-on { box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--blue); }
.photo-tile:has(input:focus-visible) { outline: 3px solid var(--blue); outline-offset: 5px; }
.pf-photo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px; margin-bottom: 4px; border: 1px solid var(--line); border-radius: 12px; background: #F8FAFD; }
.pf-photo-img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; overflow: hidden; display: block; }
.pf-photo > div { display: grid; line-height: 1.35; min-width: 0; }
.pf-photo small { font-size: 12.5px; }
@media (max-width: 999px) { .photo-top { align-items: flex-start; } .photo-preview { width: 80px; height: 80px; } }
</style>
